[package]
name = "tauri-plugin-fs-native"
version = "2.0.0"
authors = [ "naashchaa" ]
description = "A Rust-oriented implementation of tauri-plugin-fs"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-fs-native"

[dependencies]
tauri = { version = "2.7" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.3", features = ["build"] }
